name: Android APK

# Builds a debug APK for feature branches and pull requests and attaches it to the
# run (Actions → the run → Artifacts → kaizen-debug-apk). Merges to main are built
# by release.yml, which publishes the APK as a GitHub Release.
on:
  push:
    branches: ['feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned so the Ubuntu 26 switch of ubuntu-latest (Oct 2026) can't change the build unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags give the version (scripts/version.sh)

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Decide the dev version
        run: |
          source scripts/version.sh
          BASE="$(latest_release)"
          BASE="${BASE:-$(package_version)}"
          echo "DEV_VERSION=$BASE-dev+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Same code as the latest release, so it installs over it.
          echo "DEV_CODE=$(version_code "$BASE")" >> "$GITHUB_ENV"

      - name: Build web app and sync into Android
        env:
          APP_VERSION: ${{ env.DEV_VERSION }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PappVersionName="$DEV_VERSION"
          -PappVersionCode="$DEV_CODE"

      - uses: actions/upload-artifact@v7
        with:
          name: kaizen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
