name: Android APK

# Builds a debug APK on every push and pull request and attaches it to the run
# (Actions → the run → Artifacts → kaizen-debug-apk).
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned so the Ubuntu 26 switch of ubuntu-latest (Oct 2026) can't change the build unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build web app and sync into Android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        # Same version code as package.json so it installs over a release of that version.
        run: |
          VERSION="$(node -p "require('../package.json').version")"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          ./gradlew assembleDebug --no-daemon \
            -PappVersionName="$VERSION-dev+${GITHUB_SHA::7}" \
            -PappVersionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))

      - uses: actions/upload-artifact@v7
        with:
          name: kaizen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
