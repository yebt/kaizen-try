name: Release

# Every merge to main publishes a GitHub Release with the Android APK.
#
# The version is the newest vX.Y.Z tag plus a bump chosen by labels on the
# merged pull request:
#   (no label)       patch  0.2.0 -> 0.2.1
#   release:minor    minor  0.2.0 -> 0.3.0
#   release:major    major  0.2.0 -> 1.0.0
#   release:skip     no release for this merge
# Changes that only touch docs (*.md, docs/) never release.
#
# You can still release by hand: push a tag (git tag v1.2.3 && git push origin v1.2.3),
# draft a release in the GitHub UI with a new tag, or run this workflow from the
# Actions tab and pick the bump. Pre-release tags (v1.2.3-beta.1) work too.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create tags and releases
  issues: write # make sure the release:* labels exist
  pull-requests: read # read labels of the merged PR

# One release at a time, in order, so two quick merges can't claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the next version

      - name: Make sure the release labels exist
        run: |
          gh label create release:minor --color 1f6f5c --description "Merging releases a minor version (new features)" --force
          gh label create release:major --color b3261e --description "Merging releases a major version (breaking changes)" --force
          gh label create release:skip --color 6e6e77 --description "Merging does not publish a release" --force

      - name: Decide the version
        id: version
        run: |
          source scripts/version.sh
          SKIP=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A tag pushed by hand (or created with a release in the UI).
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BUMP="${{ inputs.bump }}"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              LABELS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)"
              echo "Labels on the merged PR: ${LABELS:-none}"
              BUMP=patch
              grep -qx 'release:minor' <<< "$LABELS" && BUMP=minor
              grep -qx 'release:major' <<< "$LABELS" && BUMP=major
              if grep -qx 'release:skip' <<< "$LABELS"; then
                SKIP=true
                echo "::notice::release:skip label found; no release for this merge."
              fi
            fi
            VERSION="$(next_version "${BUMP:-patch}")"
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists. Bump package.json or pick a bigger bump."
              exit 1
            fi
          fi
          CORE="${VERSION%%-*}"
          PRERELEASE=false
          if [ "$VERSION" != "$CORE" ]; then PRERELEASE=true; fi
          {
            echo "skip=$SKIP"
            echo "name=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$(version_code "$VERSION")"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Release: v$VERSION (skip=$SKIP)"

      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Test and typecheck
        if: steps.version.outputs.skip != 'true'
        run: |
          npm test
          npm run typecheck

      - name: Build web app and sync into Android
        if: steps.version.outputs.skip != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: npm run android:sync

      - name: Set up release signing key
        id: signing
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the shared debug key."
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.version.outputs.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare files
        if: steps.version.outputs.skip != 'true'
        run: |
          APK="kaizen-${{ steps.version.outputs.name }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SIGNING: ${{ steps.signing.outputs.kind }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          {
            echo "## Install on Android"
            echo "Download **$APK** below and open it on your phone (allow installs from this source when asked)."
            echo "It installs over any earlier Kaizen release, and your data stays."
            if [ "$SIGNING" = "debug" ]; then
              echo
              echo "> Signed with the shared debug key (no release key configured yet)."
            fi
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. drafted in the GitHub UI): attach the files.
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            # Creates the tag on this exact commit. Tags made with the workflow
            # token don't trigger workflows, so this can't loop.
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" \
              --title "Kaizen ${TAG#v}" --notes-file notes.md --generate-notes "${FLAGS[@]}"
          fi
